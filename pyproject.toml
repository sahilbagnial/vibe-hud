[project]
name = "vibe-hud"
version = "1.0.0"
description = "Universal ambient status light for AI coding agents"
authors = [
    {name = "sahilbagnial", email = "sahilbagnial@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pywebview (>=6.2.1,<7.0.0)",
    "psutil (>=7.1.2,<8.0.0)",
    "pystray (>=0.19.5,<1.0.0)",
    "Pillow (>=11.3.0,<13.0.0)",
    "pywin32 (>=306) ; sys_platform == 'win32'"
]

[project.scripts]
vibe-hud = "vibe_hud.cli:main"
vibe-hud-hook = "vibe_hud.cli:hook"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
briefcase = "^0.3.20"
tomlkit = "^0.13.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.briefcase]
project_name = "Vibe HUD"
bundle = "com.sahilbagnial"
version = "1.0.0"
url = "https://github.com/sahilbagnial/vibe-hud"
license.file = "LICENSE"
author = "sahilbagnial"
author_email = "sahilbagnial@gmail.com"

[tool.briefcase.app.vibe-hud]
formal_name = "Vibe HUD"
description = "Universal ambient status light for AI coding agents"
long_description = """
Vibe HUD is a floating, always-on-top desktop overlay for macOS, Windows,
and Linux that shows real-time status for AI coding agents like Claude
Code: red while it's working, amber when it needs your input, and green
when it's done. It plugs into Claude Code's lifecycle hooks over a local
HTTP server, so it never polls and adds no meaningful overhead.
"""
icon = "assets/icon/vibe-hud"
sources = ["vibe_hud"]
requires = [
    "pywebview>=6.2.1,<7.0.0",
    "psutil>=7.1.2,<8.0.0",
    "pystray>=0.19.5,<1.0.0",
    "Pillow>=11.3.0,<13.0.0",
]
# pywebview unconditionally depends on `proxy_tools`, which PyPI only ever
# published as an sdist (no wheel, any version). Briefcase's `create`/`build`
# hard-refuses to build sdists when installing app requirements (it forces
# `--only-binary :all:`, by design, for provenance/reproducibility reasons —
# see briefcase/platforms/macOS/__init__.py). We vendor a locally-built
# `py3-none-any` wheel for proxy_tools under vendor-wheels/ and point pip at
# it via --find-links so it satisfies pywebview's transitive requirement as
# an already-built wheel. Rebuild it with:
#   pip wheel proxy_tools --no-deps -w vendor-wheels/
requirement_installer_args = ["--find-links", "./vendor-wheels"]

# No [tool.briefcase.app.vibe-hud.macOS] section: Briefcase's own template
# suggests adding `std-nslog` here to redirect stdout/stderr into Console.app
# via os_log. In practice, on this Briefcase version, std-nslog's compiled
# `_oslog_shim` extension fails to import at app startup (ModuleNotFoundError,
# despite the .so being present and correctly signed), and Briefcase's
# GUI-Stub launcher treats the resulting traceback on stderr as a fatal crash,
# popping a blocking "Application has crashed" modal on every launch before
# our own window/server ever starts. std-nslog is purely a stdout/stderr
# logging convenience, not required for functionality, so we omit it rather
# than chase the underlying import bug. Do not re-add `std-nslog` here without
# re-verifying a real launch first.

[tool.briefcase.app.vibe-hud.windows]
requires = ["pywin32>=306"]

[tool.briefcase.app.vibe-hud.linux]
requires = []

[tool.briefcase.app.vibe-hud.linux.system.ubuntu]
# gir1.2-webkit2-4.0 doesn't exist on Ubuntu 24.04 "noble" — it dropped the
# old libsoup2-based WebKitGTK build entirely, keeping only the libsoup3-based
# 4.1 one. Confirmed against a real noble container (apt-cache policy shows
# no candidate for -4.0, only -4.1). pywebview's GTK backend already tries
# WebKit2 4.1 first and only falls back to 4.0 if it's missing (see
# webview/platforms/gtk.py), so this needs no application code change.
system_requires = [
    "libgirepository1.0-dev",
    "gir1.2-gtk-3.0",
    "gir1.2-webkit2-4.1",
    "libcairo2-dev",
]
