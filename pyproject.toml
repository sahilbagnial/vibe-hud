[project]
name = "vibe-hud"
version = "0.1.0"
description = "Universal ambient status light for AI coding agents"
authors = [
    {name = "sahilbagnial", email = "sahilbagnial@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pywebview (>=6.2.1,<7.0.0)",
    "psutil (>=6.0.0,<7.0.0)",
    "pystray (>=0.19.5,<1.0.0)",
    "Pillow (>=10.4.0,<11.0.0)",
    "pywin32 (>=306) ; sys_platform == 'win32'"
]

[project.scripts]
vibe-hud = "vibe_hud.cli:main"
vibe-hud-hook = "vibe_hud.cli:hook"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
