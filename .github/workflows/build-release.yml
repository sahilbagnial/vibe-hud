name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build/patch (e.g. v0.3.0)"
        required: true
        type: string
      platforms:
        description: "Comma-separated: macos,windows,ubuntu (default: macos,windows — ubuntu temporarily disabled, see FULL_MATRIX below)"
        required: false
        default: "macos,windows"
        type: string

permissions:
  contents: read

jobs:
  determine-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ inputs.platforms }}"
            TAG="${{ inputs.tag }}"
          else
            PLATFORMS="macos,windows"
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # python_cmd differs for ubuntu: Briefcase's "linux system" target
          # builds a .deb against system packages rather than bundling its
          # own Python (unlike macOS/Windows), so it requires the exact
          # interpreter running Briefcase to BE the distro's own system
          # python3 — a separately-installed actions/setup-python build,
          # even at the "same" X.Y version, is a different patch build and
          # fails Briefcase's own version-identity check. macOS/Windows have
          # no such constraint and use actions/setup-python's "python".
          #
          # ubuntu is temporarily disabled (commented out of FULL_MATRIX
          # below) — the create/build/package cycle was fully verified
          # working in a local ubuntu:24.04 container (Python-interpreter
          # match, apt system deps, gir1.2-webkit2-4.1 instead of the
          # nonexistent -4.0, CHANGELOG.md, long_description all fixed and
          # produced a real .deb), but the resulting package's runtime
          # dependency closure (does the .deb declare/pull in libgtk-3,
          # webkit2gtk, PyGObject etc. so it actually runs on a machine that
          # doesn't already have the build-time packages installed?) was not
          # yet confirmed before this was paused. Re-enable by moving this
          # entry back into FULL_MATRIX below and setting the platforms
          # defaults back to "macos,windows,ubuntu" (two spots above/below)
          # once that's verified.
          # {"os":"ubuntu-latest","platform":"ubuntu","target":"linux system","adhoc_sign":false,"asset_glob":"dist/*.deb","python_cmd":"python3"}
          FULL_MATRIX='[
            {"os":"macos-latest","platform":"macos","target":"macOS app","adhoc_sign":true,"asset_glob":"dist/*.dmg","python_cmd":"python"},
            {"os":"windows-latest","platform":"windows","target":"windows app","adhoc_sign":false,"asset_glob":"dist/*.msi","python_cmd":"python"}
          ]'
          FILTERED=$(echo "$FULL_MATRIX" | jq -c --arg platforms "$PLATFORMS" '
            [.[] | select(.platform as $p | ($platforms | split(",")) | index($p))]
          ')
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"

  build:
    needs: determine-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-matrix.outputs.tag }}

      # Skipped on ubuntu: Briefcase's "linux system" target needs to run
      # under the runner's own system python3, not a separately-installed
      # build — see the note on FULL_MATRIX above.
      - uses: actions/setup-python@v5
        if: matrix.platform != 'ubuntu'
        with:
          python-version: "3.14"

      - name: Install Poetry
        # pipx (not `pip install`/`python -m pip install`) specifically for
        # the ubuntu leg: Ubuntu's system python3 is PEP 668
        # "externally managed", so a bare pip install would fail with
        # externally-managed-environment. pipx always installs into its own
        # isolated venv regardless, so it works the same way on all three
        # platforms.
        run: pipx install poetry

      - name: Verify tag matches committed version
        shell: bash
        run: |
          COMMITTED_VERSION=$(${{ matrix.python_cmd }} -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['briefcase']['version'])")
          TAG_VERSION="${{ needs.determine-matrix.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$COMMITTED_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${{ needs.determine-matrix.outputs.tag }} does not match [tool.briefcase].version $COMMITTED_VERSION"
            exit 1
          fi

      # Briefcase's "linux system" target checks for these apt packages but
      # doesn't install them itself — it just fails `create` with a
      # "run: sudo apt install ..." message. Reading the list from
      # pyproject.toml's own [tool.briefcase.app.vibe-hud.linux.system.ubuntu]
      # system_requires (rather than hardcoding a second copy here) keeps
      # there being exactly one place this list is maintained.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu'
        run: |
          mapfile -t PACKAGES < <(python3 -c "
          import tomllib
          doc = tomllib.load(open('pyproject.toml', 'rb'))
          print('\n'.join(doc['tool']['briefcase']['app']['vibe-hud']['linux']['system']['ubuntu']['system_requires']))
          ")
          sudo apt-get update
          sudo apt-get install -y "${PACKAGES[@]}"

      - name: Install build tools
        run: |
          poetry env use ${{ matrix.python_cmd }}
          poetry install --only dev --no-root

      - name: Build and package
        shell: bash
        run: |
          poetry run briefcase create ${{ matrix.target }}
          poetry run briefcase build ${{ matrix.target }}
          if [ "${{ matrix.adhoc_sign }}" = "true" ]; then
            poetry run briefcase package ${{ matrix.target }} --adhoc-sign
          else
            poetry run briefcase package ${{ matrix.target }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-hud-${{ matrix.platform }}
          path: ${{ matrix.asset_glob }}

  release:
    needs: [determine-matrix, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.determine-matrix.outputs.tag }}"
          mapfile -t FILES < <(find artifacts -type f)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --generate-notes
          fi
