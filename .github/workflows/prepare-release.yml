name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type, or an explicit version (e.g. 0.3.0)"
        required: true
        default: "patch"
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        id: bump
        run: |
          poetry version "${{ inputs.bump }}"
          NEW_VERSION=$(poetry version --short)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          MINOR_LINE=$(echo "$NEW_VERSION" | cut -d. -f1,2)
          echo "minor_line=$MINOR_LINE" >> "$GITHUB_OUTPUT"

      - name: Sync [tool.briefcase] version to match
        run: |
          pip install tomlkit
          python3 -c "
          import tomlkit
          with open('pyproject.toml') as f:
              doc = tomlkit.load(f)
          doc['tool']['briefcase']['version'] = '${{ steps.bump.outputs.version }}'
          with open('pyproject.toml', 'w') as f:
              tomlkit.dump(doc, f)
          "

      - name: Create or reuse release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/${{ steps.bump.outputs.minor_line }}"
          git checkout -B "$BRANCH"
          git add pyproject.toml poetry.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "$BRANCH"
          git push origin "v${{ steps.bump.outputs.version }}"
